name: Package desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/package-desktop.yml"
      - "desktop/**"
      - "serum2vital/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: macOS arm64
            artifact: macos-arm64
          - runner: macos-15-intel
            label: macOS x86_64
            artifact: macos-x86_64
          - runner: windows-2022
            label: Windows x86_64
            artifact: windows-x86_64
          - runner: ubuntu-22.04
            label: Linux x86_64
            artifact: linux-x86_64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[desktop,package,dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build and smoke-test package
        run: python desktop/build.py

      - name: Verify Linux native Qt platform
        if: matrix.artifact == 'linux-x86_64'
        run: xvfb-run -a dist/desktop/Serum2Vital/Serum2Vital --smoke-test

      - name: Upload packaged application
        uses: actions/upload-artifact@v7
        with:
          name: Serum2Vital-${{ matrix.artifact }}
          path: dist/packages/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          fi

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* --verify-tag --generate-notes
          fi
